<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice RAG</title>
<style>
  :root {
    --ink:        #101119;
    --panel:      #171925;
    --line:       #262939;
    --line-soft:  #1e2130;
    --text:       #E6E7EE;
    --muted:      #7E839A;
    --signal-in:  #F5A623;  /* you */
    --signal-out: #5CC9BE;  /* it  */
    --danger:     #E86A5C;

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --read: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    color: var(--text);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---- status rail ---------------------------------------------------- */
  .rail {
    width: 100%;
    border-bottom: 1px solid var(--line-soft);
    padding: 10px 18px;
    display: flex;
    gap: 18px;
    align-items: center;
    font-size: 11px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .rail .spacer { flex: 1; }
  .rail button {
    font: inherit;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 4px 9px;
    cursor: pointer;
  }
  .rail button:hover { color: var(--text); border-color: var(--muted); }

  main {
    width: 100%;
    max-width: 660px;
    padding: 0 22px 120px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* ---- signature: the meter ------------------------------------------- */
  .meter {
    margin: 54px 0 0;
    height: 108px;
    position: relative;
  }
  canvas { width: 100%; height: 100%; display: block; }

  .state {
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    height: 14px;
    transition: color .18s;
  }
  .state[data-s="listening"] { color: var(--signal-in); }
  .state[data-s="speaking"]  { color: var(--signal-out); }
  .state[data-s="error"]     { color: var(--danger); }

  /* ---- transcript + answer -------------------------------------------- */
  .heard {
    margin: 40px 0 0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
    min-height: 21px;
  }
  .heard::before {
    content: "you ";
    color: var(--signal-in);
    opacity: .7;
  }
  .heard:empty { display: none; }
  .heard.interim { opacity: .5; }

  .rewritten {
    margin: 6px 0 0;
    font-size: 11px;
    letter-spacing: .04em;
    color: var(--signal-out);
    opacity: .6;
  }
  .rewritten:empty { display: none; }

  .answer {
    margin: 18px 0 0;
    font-family: var(--read);
    font-size: clamp(1.3rem, 3.6vw, 1.75rem);
    line-height: 1.45;
    letter-spacing: -.005em;
  }

  .sources {
    margin-top: 26px;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .chip {
    font-size: 10.5px;
    letter-spacing: .06em;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 4px 8px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty {
    margin-top: 40px;
    padding: 22px;
    border: 1px dashed var(--line);
    border-radius: 3px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
  }
  .empty b { color: var(--text); font-weight: 500; }

  /* ---- control dock --------------------------------------------------- */
  .dock {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 11px;
    padding: 22px 0 26px;
    background: linear-gradient(to top, var(--ink) 62%, transparent);
  }
  .mic {
    width: 62px; height: 62px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: border-color .16s, background .16s, transform .1s;
  }
  .mic:hover { border-color: var(--muted); }
  .mic:active { transform: scale(.96); }
  .mic:focus-visible { outline: 2px solid var(--signal-in); outline-offset: 3px; }
  .mic[data-live="1"] {
    border-color: var(--signal-in);
    background: color-mix(in srgb, var(--signal-in) 14%, var(--panel));
  }
  .mic svg { width: 21px; height: 21px; }
  .hint {
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: .65;
  }

  input[type=file] { display: none; }

  .typed {
    width: min(420px, 82vw);
    margin-top: 2px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    background: none;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 6px 2px;
    text-align: center;
  }
  .typed::placeholder { color: var(--muted); opacity: .55; }
  .typed:focus {
    outline: none;
    border-bottom-color: var(--signal-in);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="rail">
  <span id="stat-docs">loading</span>
  <span id="stat-llm"></span>
  <span id="stat-turns"></span>
  <span class="spacer"></span>
  <button id="btn-new">New topic</button>
  <button id="btn-test">Test voice</button>
  <button id="btn-add">Add files</button>
  <button id="btn-reindex">Rebuild index</button>
</div>

<main>
  <div class="meter"><canvas id="cv"></canvas></div>
  <div class="state" id="state" data-s="idle">ready</div>

  <div class="heard" id="heard"></div>
  <div class="rewritten" id="rewritten"></div>
  <div class="answer" id="answer"></div>
  <div class="sources" id="sources"></div>

  <div class="empty" id="empty" hidden>
    <b>No documents indexed.</b><br />
    Drop <code>.pdf</code>, <code>.txt</code> or <code>.md</code> files into the
    <code>docs/</code> folder and press Rebuild index — or use Add files above.
  </div>
</main>

<div class="dock">
  <button class="mic" id="mic" data-live="0" aria-label="Start listening">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="2" width="6" height="11" rx="3" />
      <path d="M5 10a7 7 0 0 0 14 0" />
      <path d="M12 17v5" />
    </svg>
  </button>
  <div class="hint">press to talk · press again to send</div>
  <input id="typed" class="typed" type="text"
         placeholder="or type a question and press enter" autocomplete="off" />
</div>

<input type="file" id="filepick" multiple accept=".pdf,.txt,.md" />

<script>
// ---------------------------------------------------------------- config
const LANG = "en-IN";   // "en-US", "en-GB", "hi-IN" ... Chrome locale code

// ---------------------------------------------------------------- element refs
const $state   = document.getElementById("state");
const $heard   = document.getElementById("heard");
const $answer  = document.getElementById("answer");
const $sources = document.getElementById("sources");
const $empty   = document.getElementById("empty");
const $mic     = document.getElementById("mic");
const $docs    = document.getElementById("stat-docs");
const $llm     = document.getElementById("stat-llm");
const $pick    = document.getElementById("filepick");
const $turns   = document.getElementById("stat-turns");
const $rewritten = document.getElementById("rewritten");
const cv       = document.getElementById("cv");
const ctx      = cv.getContext("2d");

let state = "idle";     // idle | listening | thinking | speaking | error
function setState(s, label) {
  state = s;
  $state.dataset.s = s;
  $state.textContent = label ?? s;
}

// ---------------------------------------------------------------- the meter
// One element, four states. It is the only thing on the page that moves.
const BARS = 64;
let analyser = null, timeData = null, t = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width  = cv.clientWidth  * dpr;
  cv.height = cv.clientHeight * dpr;
}
addEventListener("resize", resize);

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function amplitudes() {
  const a = new Array(BARS);

  if (state === "listening" && analyser) {
    analyser.getByteTimeDomainData(timeData);
    const per = Math.floor(timeData.length / BARS);
    for (let i = 0; i < BARS; i++) {
      let sum = 0;
      for (let j = 0; j < per; j++) {
        const v = (timeData[i * per + j] - 128) / 128;
        sum += v * v;
      }
      a[i] = Math.min(1, Math.sqrt(sum / per) * 3.4);
    }
    return a;
  }

  if (state === "listening") {                       // mic meter unavailable
    for (let i = 0; i < BARS; i++)
      a[i] = 0.18 + 0.16 * Math.abs(Math.sin(t / 14 + i / 5));
    return a;
  }

  if (state === "thinking") {                        // a pulse travelling across
    const head = (t / 2.2) % (BARS + 26) - 13;
    for (let i = 0; i < BARS; i++) {
      const d = i - head;
      a[i] = 0.045 + 0.72 * Math.exp(-(d * d) / 26);
    }
    return a;
  }

  if (state === "speaking") {                        // synthesised voice bands
    for (let i = 0; i < BARS; i++) {
      const env = Math.sin((i / BARS) * Math.PI);
      a[i] = 0.06 + env * 0.62 * Math.abs(
        Math.sin(t / 7 + i / 3.1) * 0.6 + Math.sin(t / 4.3 + i / 1.7) * 0.4
      );
    }
    return a;
  }

  for (let i = 0; i < BARS; i++)                     // idle — resting line
    a[i] = 0.028 + 0.018 * Math.sin(t / 30 + i / 9);
  return a;
}

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function draw() {
  requestAnimationFrame(draw);
  if (!reduceMotion || state === "idle") t += 1;

  const w = cv.width, h = cv.height, mid = h / 2;
  const dpr = window.devicePixelRatio || 1;
  ctx.clearRect(0, 0, w, h);

  const a = amplitudes();
  const gap = 3 * dpr;
  const bw = (w - gap * (BARS - 1)) / BARS;

  ctx.fillStyle =
    state === "listening" ? css("--signal-in")  :
    state === "speaking"  ? css("--signal-out") :
    state === "error"     ? css("--danger")     : css("--line");

  for (let i = 0; i < BARS; i++) {
    const bh = Math.max(2 * dpr, a[i] * (h * 0.86));
    const x = i * (bw + gap);
    ctx.globalAlpha = state === "thinking" ? 0.35 + a[i] : 1;
    ctx.fillRect(x, mid - bh / 2, bw, bh);
  }
  ctx.globalAlpha = 1;
}
resize(); draw();

async function initMeter() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    analyser = ac.createAnalyser();
    analyser.fftSize = 1024;
    timeData = new Uint8Array(analyser.fftSize);
    ac.createMediaStreamSource(stream).connect(analyser);
  } catch (e) {
    analyser = null;   // meter falls back to a synthetic animation
  }
}

// ---------------------------------------------------------------- speech out
let voice = null;

function pickVoice() {
  const all = speechSynthesis.getVoices();
  if (!all.length) return false;

  // Chrome lists Google voices that stream from Google's servers. They fail
  // silently — no error, no audio. Local OS voices always work.
  const local = all.filter(v => v.localService);
  const pool = local.length ? local : all;
  const prefix = LANG.slice(0, 2);

  voice = pool.find(v => v.lang === LANG)
       || pool.find(v => v.lang && v.lang.replace("_", "-").startsWith(prefix))
       || pool.find(v => v.lang && v.lang.startsWith("en"))
       || pool[0];

  console.log(
    `[tts] using "${voice.name}" (${voice.lang}) · ` +
    `${all.length} voices, ${local.length} local`
  );
  return true;
}

speechSynthesis.addEventListener("voiceschanged", pickVoice);
if (!pickVoice()) {
  // getVoices() is empty on first call in Chrome and voiceschanged is unreliable
  let tries = 0;
  const poll = setInterval(() => {
    if (pickVoice() || ++tries > 20) clearInterval(poll);
  }, 150);
}

let ttsBuf = "";
let queued = 0;
const held = [];   // Chrome garbage-collects utterances mid-sentence

function say(sentence) {
  if (!sentence.trim()) return;

  const u = new SpeechSynthesisUtterance(sentence);
  if (voice) u.voice = voice;
  u.rate = 1.04;
  u.volume = 1;

  held.push(u);
  queued++;

  u.onstart = () => { if (state !== "listening") setState("speaking"); };

  const finish = (err) => {
    if (err) console.warn("[tts] utterance failed:", err.error || err);
    const i = held.indexOf(u);
    if (i > -1) held.splice(i, 1);
    queued = Math.max(0, queued - 1);
    if (queued === 0 && state === "speaking") setState("idle", "ready");
  };
  u.onend = () => finish();
  u.onerror = finish;

  speechSynthesis.resume();   // clears the paused state cancel() can leave behind
  speechSynthesis.speak(u);
}

// Speak sentence by sentence as tokens arrive — audio starts long before the
// full answer does, which is most of what makes this feel fast.
function feedTTS(token, flush = false) {
  ttsBuf += token;
  let m;
  while ((m = ttsBuf.match(/^([\s\S]*?[.!?])(\s|$)/))) {
    const s = m[1].trim();
    if (s) say(s);
    ttsBuf = ttsBuf.slice(m[0].length);
  }
  if (flush) {
    const rest = ttsBuf.trim();
    ttsBuf = "";
    if (rest) say(rest);
    else if (queued === 0) setState("idle", "ready");
  }
}

function stopSpeaking() {
  // An unconditional cancel() can wedge Chrome's synth engine so later
  // speak() calls are silently dropped. Only cancel if there's something to cancel.
  if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  held.length = 0;
  ttsBuf = "";
  queued = 0;
}

// ---------------------------------------------------------------- speech in
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
let wantListening = false;   // what the user asked for
let listening = false;       // what the engine is actually doing
let finalText = "";          // accumulated across pauses

if (!SR) {
  setState("error", "no speech recognition — use chrome or edge");
  $mic.disabled = true;
} else {
  rec = new SR();
  rec.lang = LANG;
  rec.continuous = true;     // don't give up the moment you stop for breath
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  rec.onstart = () => {
    listening = true;
    $mic.dataset.live = "1";
    setState("listening", "listening · press again to send");
  };

  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const txt = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += txt + " ";
      else interim += txt;
    }
    $heard.textContent = (finalText + interim).trim();
    $heard.classList.toggle("interim", !finalText);
    // Deliberately does NOT send here — you decide when you're finished.
  };

  rec.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      wantListening = false;
      setState("error", "microphone blocked — allow it in the address bar");
      return;
    }
    if (e.error === "no-speech" || e.error === "aborted") return;
    console.warn("[stt]", e.error);
    setState("error", e.error);
  };

  rec.onend = () => {
    // Chrome ends the session on its own after silence. If the user hasn't
    // pressed stop, start it again so a long pause doesn't lose the question.
    if (wantListening) {
      try { rec.start(); return; } catch (_) {}
    }
    listening = false;
    $mic.dataset.live = "0";

    const q = finalText.trim();
    if (q) ask(q);
    else if (state === "listening") setState("idle", "ready");
  };
}

function toggleMic() {
  if (!rec) return;

  if (wantListening) {          // second press — done talking, send it
    wantListening = false;
    setState("thinking");
    try { rec.stop(); } catch (_) {}
    return;
  }

  wantListening = true;         // first press — start fresh
  finalText = "";
  stopSpeaking();               // barge-in: talking over it cuts it off
  $heard.textContent = "";
  $answer.textContent = "";
  $sources.innerHTML = "";
  initMeter();
  try { rec.start(); } catch (_) {}
}

$mic.addEventListener("click", toggleMic);
addEventListener("keydown", (e) => {
  if (e.code !== "Space" || e.repeat) return;
  if (["INPUT", "TEXTAREA", "BUTTON"].includes(document.activeElement?.tagName)) return;
  e.preventDefault();
  toggleMic();
});

// ---------------------------------------------------------------- ask
const HISTORY_TURNS = 3;   // enough for follow-ups, short enough to stay fast
const history = [];

function clearHistory() {
  history.length = 0;
  $turns.textContent = "";
  $rewritten.textContent = "";
}

async function ask(question) {
  setState("thinking");
  $answer.textContent = "";
  $sources.innerHTML = "";
  $rewritten.textContent = "";

  let res;
  try {
    res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, history })
    });
  } catch (e) {
    console.error("[ask] fetch failed", e);
    setState("error", "backend unreachable — is uvicorn running?");
    return;
  }

  // Without this, a 500 gets read as if it were SSE, nothing parses, and the
  // UI sits on "thinking" forever with no clue why.
  if (!res.ok) {
    const detail = await res.text().catch(() => "");
    console.error(`[ask] HTTP ${res.status}`, detail);
    setState("error", `http ${res.status} — see the uvicorn terminal`);
    $answer.textContent = detail.slice(0, 400) || `Backend returned ${res.status}.`;
    return;
  }

  try {
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    let got = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });

      const frames = buf.split("\n\n");
      buf = frames.pop();

      for (const frame of frames) {
        if (!frame.startsWith("data: ")) continue;
        let msg;
        try { msg = JSON.parse(frame.slice(6)); } catch { continue; }

        if (msg.type === "token") {
          got++;
          $answer.textContent += msg.text;
          feedTTS(msg.text);
        } else if (msg.type === "query") {
          // the follow-up, resolved into something searchable
          $rewritten.textContent = `searched: ${msg.text}`;
        } else if (msg.type === "sources") {
          $sources.innerHTML = "";
          for (const s of msg.sources) {
            const chip = document.createElement("span");
            chip.className = "chip";
            chip.textContent = s;
            $sources.appendChild(chip);
          }
        } else if (msg.type === "error") {
          console.error("[ask] backend error:", msg.text);
          setState("error", msg.text.slice(0, 80));
          $answer.textContent = msg.text;
        } else if (msg.type === "done") {
          feedTTS("", true);
        }
      }
    }

    if (got === 0 && state !== "error") {
      setState("error", "empty response — check the uvicorn terminal");
      return;
    }

    const answer = $answer.textContent.trim();
    if (answer) {
      history.push({ q: question, a: answer });
      while (history.length > HISTORY_TURNS) history.shift();
      $turns.textContent = `${history.length} turn${history.length === 1 ? "" : "s"}`;
    }
  } catch (e) {
    console.error("[ask] stream failed", e);
    setState("error", "stream broke — see console");
  }
}

// ---------------------------------------------------------------- documents
async function refreshHealth() {
  try {
    const h = await (await fetch("/health")).json();
    const n = h.files.length;
    $docs.textContent = h.chunks
      ? `${n} file${n === 1 ? "" : "s"} · ${h.chunks} chunks`
      : "no documents";
    $llm.textContent = h.key_ok
      ? `${h.provider} · ${h.model}`
      : `${h.provider} · no api key`;
    $llm.style.color = h.key_ok ? "" : "var(--danger)";
    $empty.hidden = h.chunks > 0;
  } catch {
    $docs.textContent = "backend offline";
  }
}

document.getElementById("btn-reindex").addEventListener("click", async (e) => {
  e.target.textContent = "Rebuilding…";
  await fetch("/reindex", { method: "POST" });
  e.target.textContent = "Rebuild index";
  refreshHealth();
});

document.getElementById("typed").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim();
  if (!q) return;
  e.target.value = "";
  stopSpeaking();
  $heard.textContent = q;
  $heard.classList.remove("interim");
  ask(q);
});

document.getElementById("btn-new").addEventListener("click", () => {
  stopSpeaking();
  clearHistory();
  $heard.textContent = "";
  $answer.textContent = "";
  $sources.innerHTML = "";
  setState("idle", "ready");
});

document.getElementById("btn-test").addEventListener("click", () => {
  stopSpeaking();
  const name = voice ? `${voice.name}` : "the default voice";
  console.log("[tts] test with", name);
  say("Voice output is working.");
});

document.getElementById("btn-add").addEventListener("click", () => $pick.click());

$pick.addEventListener("change", async () => {
  if (!$pick.files.length) return;
  const fd = new FormData();
  for (const f of $pick.files) fd.append("files", f);
  $docs.textContent = "indexing…";
  await fetch("/upload", { method: "POST", body: fd });
  $pick.value = "";
  refreshHealth();
});

refreshHealth();
</script>
</body>
</html>
